plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.2.2"
    id 'maven-publish'
}


group = 'me.lyamray'

repositories {
    mavenCentral()
    maven { url "https://repo.fancyinnovations.com/releases" }
    maven { name = "papermc-repo"; url = uri("https://repo.papermc.io/repository/maven-public/") }
}

dependencies {
    // Paper
    compileOnly("io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT")

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // FancyNPCs
    compileOnly("de.oliver:FancyNpcs:2.7.0")

    //FancyHolograms
    compileOnly("de.oliver:FancyHolograms:2.8.0")

}


tasks {
    runServer {
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

static def incrementVersion(String version) {
    def parts = version.tokenize('.')*.toInteger()
    parts[-1] = parts[-1] + 1
    if (parts[-1] > 99) {
        parts[-1] = 0
        parts[-2] = parts[-2] + 1
    }
    return parts.join('.')
}

tasks.register('bumpVersion') {
    doLast {
        def propertiesFile = file('gradle.properties')
        def props = new Properties()
        propertiesFile.withInputStream { props.load(it) }

        def currentVersion = props.getProperty('version')
        def newVersion = incrementVersion(currentVersion)

        println "Bumping version from $currentVersion to $newVersion"

        props.setProperty('version', newVersion)
        propertiesFile.withOutputStream { props.store(it, null) }

        project.version = newVersion
    }
}

tasks.named('jar') {
    doFirst {
        def isWindows = System.properties['os.name'].toLowerCase().contains('windows')
        if (isWindows) {
            destinationDirectory.set(file("C:/Users/lyamr/Desktop/BeneluxeSMP/plugins"))

            def dir = destinationDirectory.get().asFile
            dir.listFiles()?.findAll {
                it.name.startsWith("${project.name}-") && it.name.endsWith(".jar")
            }?.each { it.delete() }

            println "Deleted old JARs in $dir"
        } else {
            destinationDirectory.set(layout.buildDirectory.dir("libs"))
            println "Running on non-Windows (JitPack likely) → using build/libs"
        }
    }

    archiveFileName.set("${project.name}-${project.version}.jar")
}

processResources {
    dependsOn tasks.named('bumpVersion')

    def propsMap = [
            name   : project.name,
            version: project.version
    ]

    inputs.properties propsMap
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand propsMap
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group
            artifactId = project.name
            version = project.version

            pom {
                name = project.name
                description = "Benelux SMP Core plugin library"
                url = "https://github.com/lyamray/BeneluxSMPCore"

                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }

                developers {
                    developer {
                        id = "lyamray"
                        name = "LyamRay"
                    }
                }

                scm {
                    connection = "scm:git:git://github.com/lyamray/BeneluxSMPCore.git"
                    developerConnection = "scm:git:ssh://github.com/lyamray/BeneluxSMPCore.git"
                    url = "https://github.com/lyamray/BeneluxSMPCore"
                }
            }
        }
    }
}
